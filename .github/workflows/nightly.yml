name: Nightly tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  nightly:
    uses: ./.github/workflows/tests.yml
    with:
      latest-showdown: true
    secrets: inherit
  nightly-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        battle-format:
          - gen1randombattle
          - gen2randombattle
          - gen3randombattle
          - gen4randombattle
          - gen5randombattle
          - gen6randombattle
          - gen7randombattle
          - gen8randombattle
          - gen9randombattle
          - gen9randomdoublesbattle
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout PS
        uses: actions/checkout@v7
        with:
          repository: smogon/pokemon-showdown
          path: pokemon-showdown
          submodules: recursive

      - name: Get last showdown commit hash
        id: showdown-hash
        run: |
          cd pokemon-showdown/
          export hash=`git log -1 --pretty=format:%H`
          echo "hash=$hash" >> $GITHUB_OUTPUT

      - name: Restore server cache
        uses: actions/cache@v6
        with:
          path: pokemon-showdown/node_modules
          key: showdown-${{ runner.os }}-node24-${{ steps.showdown-hash.outputs.hash }}
          restore-keys: showdown-${{ runner.os }}-node24-

      - name: Install PS dependencies and start server
        timeout-minutes: 3
        run: bash scripts/ci_setup_showdown.sh

      - name: Run nightly-only checks
        run: uv run pytest -v strict_integration_tests/ -k "${{ matrix.battle-format }}" --junitxml=strict-results.xml

      - name: Upload Showdown log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: showdown-nightly-extra-${{ matrix.battle-format }}
          path: pokemon-showdown/server.log
          if-no-files-found: ignore

      - name: Upload strict test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-results-${{ matrix.battle-format }}
          path: strict-results.xml
          if-no-files-found: ignore
